# Rebuilds foods.json with USDA FNDDS survey foods (mixed dishes, restaurant-style items, household portions).
# Run it from the Actions tab ("Build food list" → Run workflow) when USDA publishes a new FNDDS release.
name: Build food list

on:
  workflow_dispatch:
    inputs:
      fndds_url:
        description: USDA FNDDS survey foods JSON zip (from fdc.nal.usda.gov/download-datasets)
        default: https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_survey_food_json_2024-10-31.zip
  push:
    branches: [bundle-fndds]
    paths: [tools/build_foods.py, .github/workflows/build-foods.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download FNDDS
        env:
          URL: ${{ inputs.fndds_url || 'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_survey_food_json_2024-10-31.zip' }}
        run: curl -fsSL --retry 3 -o "survey_$(basename "$URL" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}').zip" "$URL" && ls -la *.zip
      - name: Build foods.json
        run: python3 tools/build_foods.py survey_*.zip foods.json && rm survey_*.zip && ls -la foods.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add foods.json
          git diff --cached --quiet && echo "No change" || (git commit -m "Rebuild foods.json with USDA FNDDS survey foods" && git push)
